<!DOCTYPE html>
<html lang="en">

  {% include head.html %}

  <body>

    {% include header.html %}
    
    <div class="page-content transparent" style="background-image: url('/assets/download-bg.webp');" >         
      <article id="main">
        <header class="container" style="padding-top: 4em;text-align:center;">
        </header>

        <section class="style4 wrapper container">
          {{ content }}
        </section>
      </article>
    </div>
    {% include footer.html %}

  </body>
  <script type="text/javascript">
    (function() {
      const current = document.getElementById('download-current');
      const others = document.getElementById('download-others');
      if (!current || !others)
        return;

      const platform = navigator.platform || '';
      const ua = navigator.userAgent || '';
      let os = null;
      if (platform.includes('Win'))
        os = 'win';
      else if (platform.includes('Mac'))
        os = 'mac';
      else if (platform.includes('Linux') && !ua.includes('Android')) {
        if (/x86_64|amd64/i.test(platform))
          os = 'linux-x86_64';
        else if (/aarch64|arm64|armv8/i.test(platform))
          os = 'linux-aarch64';
        else
          os = 'linux';
      }

      // Unknown OS: keep every download in the large row
      if (!os)
        return;

      for (const btn of Array.from(current.querySelectorAll('a[data-os]'))) {
        if (!btn.dataset.os.split(' ').includes(os)) {
          btn.classList.add('small');
          others.appendChild(btn);
        }
      }
      document.getElementById('download-others-block').style.display = 'block';
    })();
  </script>
</html>
