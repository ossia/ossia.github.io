---
layout: default
---

<article id="main">
  <header class="container" style="padding-top: 6em;text-align:center;">
  
    <div class="menu">
            <a href="/score/about.html" class="menu-item" ><span class="icon-svg icon-about"></span>About</a>
            <a href="/score/download.html" class="menu-item" ><span class="icon-svg icon-download"></span>Download</a>
    </div>
        
  <h1 class="page-title">{{ page.title }}</h1> 
  </header>
  <section class="wrapper style4 container">
    {{ content }}
  </section>
</article>

<script>
for (const a of document.querySelectorAll('.menu a')) {
    if (a.textContent === {{ page.title | jsonify }}) { a.classList.add('active'); break; }
}
</script>
