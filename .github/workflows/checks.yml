name: Site checks

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    name: Build, links, HTML, downloads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Internal links, images and alt text
        run: |
          bundle exec htmlproofer ./_site \
            --disable-external \
            --checks Links,Images,Scripts \
            --no-enforce-https \
            --ignore-urls "/^\/(score-docs|score-web|ossia-docs|libossia\/)/,/^https:\/\/ossia\.io\/(score-docs|score-web|ossia-docs|libossia\/)/" \
            --swap-urls "^https\://ossia\.io:"

      # Markup validity and accessibility rules (.htmlvalidate.json)
      - name: HTML validation
        run: npm run check:html

      - name: Download links of the current release exist
        run: |
          ./.github/scripts/check-downloads.sh _site/score/download.html
          ./.github/scripts/check-downloads.sh _site/site-libossia/download.html

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 3

  lint:
    name: Prettier, ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  browser-checks:
    name: Privacy scan, accessibility audit
    needs: build-and-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Nothing may leave the site, and no cookie may be set, before consent
      - name: Privacy scan
        run: npm run check:privacy
      # axe-core, WCAG 2.0-2.2 A and AA, every page
      - name: Accessibility audit
        run: npm run check:a11y

  lighthouse:
    name: Lighthouse
    needs: build-and-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.github/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: gitleaks (whole history)
        env:
          GH_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: 8.30.1
        run: |
          gh release download "v$GITLEAKS_VERSION" -R gitleaks/gitleaks \
            -p "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -p "gitleaks_${GITLEAKS_VERSION}_checksums.txt" -D /tmp/gitleaks
          cd /tmp/gitleaks
          grep "linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          cd "$GITHUB_WORKSPACE"
          /tmp/gitleaks/gitleaks git . --no-banner --redact --verbose
