name: Scheduled checks

# Things that change outside this repository: external pages and release assets
# move, new releases come out. A failure opens (or updates) an issue, so that it
# is seen instead of staying red in a tab nobody opens.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  external-links:
    name: External links and release downloads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Download links of the current release exist
        run: |
          ./.github/scripts/check-downloads.sh _site/score/download.html
          ./.github/scripts/check-downloads.sh _site/site-libossia/download.html
      # The documentation (/score-docs/) is another repository: its links are
      # checked on the live site. GitHub line anchors (#L12) are added by
      # JavaScript, and 418/5xx are temporary errors of external sites.
      - name: External links
        shell: bash
        run: |
          bundle exec htmlproofer ./_site \
            --checks Links \
            --ignore-status-codes "403,418,429,500,502,503,504,999" \
            --no-enforce-https \
            --hydra '{"max_concurrency": 4}' \
            --typhoeus '{"followlocation": true, "connecttimeout": 20, "timeout": 30}' \
            --ignore-urls "/^\/(score-web|ossia-docs|libossia\/)/,/^https:\/\/ossia\.io\/(score-web|ossia-docs|libossia\/)/,/web\.archive\.org/,/github\.com\/.*#L\d+/" \
            --swap-urls "^https\://ossia\.io/(?!score-docs/|score-web|ossia-docs|libossia/):/,^/score-docs/:https\://ossia.io/score-docs/" \
            2>&1 | tee htmlproofer.log
      - name: Open or update an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/report-issue.sh "Broken links on ossia.io" htmlproofer.log

  latest-release:
    name: Site is on the latest releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare _config.yml with the latest GitHub releases
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/check-latest-release.mjs 2>&1 | tee release.log
      - name: Open or update an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/report-issue.sh "The website is not on the latest release" release.log
