# Works made with ossia, shown on /gallery.html.
# Entries with an `image` become cards; the others go in the "More works" table.
# Order is the display order (newest first, then earlier works).
#
# Fields:
#   title, artists          required
#   year, place             optional, shown as "year · place"
#   url                     main link (artist / project page)
#   links                   optional extra links: [{label, url}]
#   image                   file name in assets/gallery/
#   credit                  photo credit, shown small in the image corner
#   ossia                   what ossia did in the work
#   award                   optional highlight line
#   kind                    list of: installation, performance, stage, museum, education
#   featured                true: double-width card
#   sat                     true: made in collaboration with SAT (Société des arts technologiques)
#
# French page (/fr/galerie.html): add a field with the `_fr` suffix next to
# the English one when the English text needs translating; without it the
# English text is shown.
#   ossia_fr                what ossia did in the work
#   award_fr                award line
#   place_fr                only when the place name differs in French (cities, countries, "residency"...)
#   artists_fr              only when the line has English words ("in collaboration with", "music by"...)
#   title_fr                only for descriptive titles, never for the title of a work
#   label_fr                in a `links` entry, when the label is a generic word
# Names of works, people, companies and software are not translated.

