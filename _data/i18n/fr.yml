  script_intro: "Plusieurs langages de programmation sont intégrés à ossia score :"
  script_1: "Livecoder en JavaScript directement dans la partition pour des mappings avancés, ou créer des scripts de mapping d'appareils"
  script_2: "Créer des traitements audio très rapides avec Faust"
  script_3: "Étendre n'importe quelle partie du logiciel par l'API C++"
  script_4: "Écrire de simples expressions mathématiques pour un contrôle rapide"
  modular_title: "Travail à la fois modulaire et sur timeline"
  modular_intro: "On peut connecter les processus de façon modulaire directement depuis la timeline :"
  modular_1: "Passer à tout moment de la timeline à la vue nodale pour éditer plus précisément les processus"
  modular_2: "Créer des partitions proches des machines à états pour des scénarios atemporels"
  modular_3: "Imbriquer et grouper sans limite de profondeur"
  modular_alt: "Passage de la timeline à la vue nodale dans ossia score"
