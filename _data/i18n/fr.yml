  media_title: "Un séquenceur intermédia"
  media_intro: "On peut séquencer différents types de médias dans une timeline intelligente :"
  media_1: "Lecture de la plupart des formats audio, avec prise en charge du multicanal"
  media_2: "Lecture vidéo H.264 et HAP, avec une chaîne de traitement vidéo et de shaders multiplateforme à la pointe"
  media_3: "Envoi et réception d'OSC, de MIDI et de DMX, ou communication directe par HTTP ou par un port série"
  media_4: "Contrôle de systèmes IoT grâce à la prise en charge de CoAP, MQTT et BLE"
