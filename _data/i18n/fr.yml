  interaction_1: "Déclencher n'importe quelle partie de la partition selon des conditions externes ou des contrôles matériels"
  interaction_2: "Utiliser des conditions pour créer visuellement des partitions à embranchements"
  interaction_3: "Contrôler et être contrôlé par n'importe quels appareils et protocoles externes, avec une interface utilisateur simplifiée"
  interaction_alt: "Déclenchement de parties d'une partition par des événements externes dans ossia score"
  script_alt: "Scripts"
