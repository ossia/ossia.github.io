# Site settings
title: ossia | Open Software System for Interactive Applications
email: contact@ossia.io
description: > # this means to ignore newlines until "baseurl:"
  Open Software System for Interactive Applications - home of ossia score, a free, open-source, cross-platform intermedia sequencer for precise and flexible scripting of interactive scenarios.
baseurl: "" # the subpath of your site, e.g. /blog/
url: "https://ossia.io" # the base hostname & protocol for your site
image: "/assets/score-logo.png"
social_image: "/assets/social/ossia-score-og.jpg"
include: ["_pages", "CNAME", ".nojekyll", "score-last-version.txt", "download-stats.json", ".well-known"]
# Tooling for the checks (npm, linters): not part of the site
exclude: ["vendor", "node_modules", "package.json", "package-lock.json", "eslint.config.mjs", "renovate.json5", "README.md", "Gemfile", "Gemfile.lock"]
permalink: /posts/:title/
score_version: 3.9.0
libossia_version: 2.1.0
libossia_released_date: "June 20, 2026"
score_released_date: "October 15, 2026"
plugins:
  - jekyll-sitemap
  - jekyll-assets

# Build settings
markdown: kramdown
collections:
  score_features:
    output: false
  libossia_features:
    output: true

assets:
  sources:
    - assets
    - images
    - css
    - js
  compress:
    css: true
    js: uglifier
